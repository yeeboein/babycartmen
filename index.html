<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baby Cartmen</title>
  <link rel="icon" type="image/png" href="Main.png">

  <!-- Link preview / embed -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Baby Cartmen">
  <meta property="og:title" content="Baby Cartmen">
  <meta property="og:description" content="cartmen is life, life is cartmen">
  <meta property="og:url" content="https://babycartmen.org">
  <meta property="og:image" content="https://babycartmen.org/Main.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1179">
  <meta property="og:image:height" content="1169">
  <meta property="og:image:alt" content="Baby Cartmen">
  <meta name="theme-color" content="#d4143c">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://babycartmen.org/Main.png">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #f7f7f7;
    }
    img.main {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    #corner-links {
      position: fixed;
      bottom: 0;
      left: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: stretch; /* both buttons end up the same width */
    }
    .corner-btn {
      font: 9px sans-serif;
      line-height: 1;
      color: #666;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid #bbb;
      border-left: 0;
      border-bottom: 0;
      padding: 3px 6px;
      text-decoration: none;
      text-align: center;
    }
    #discord-btn { border-top-right-radius: 3px; }
    .corner-btn:hover { background: #fff; }
    #toast {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font: 12px sans-serif;
      color: #fff;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 12px;
      padding: 4px 10px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <img class="main" id="main" src="Main.png" alt="Baby Cartmen" draggable="false">

  <div id="corner-links">
    <a id="discord-btn" class="corner-btn" href="https://discord.gg/csbu3p4kvM">Discord</a>
    <a id="legal-btn" class="corner-btn" href="https://babycartmen.org/Copyright.txt">Legal</a>
  </div>
  <div id="toast"></div>
  <audio id="player"></audio>

  <script>
    const songs = ['Song1.mp3', 'Song2.mp3', 'Song3.mp3', 'Song4.mp3'];
    const player = document.getElementById('player');
    const mainImg = document.getElementById('main');
    const toast = document.getElementById('toast');

    const cache = {};      // song index -> promise of a playable URL
    let queue = [];        // shuffled play order
    let last = -1;
    let upcoming;
    let errorStreak = 0;
    let loading = false;

    // Small on-screen message
    let toastTimer;
    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1200);
    }

    // Speaking animation: swap Main.png / Speaking.png while audio is playing
    const SPEAK_MS = 200;                    // how fast the image switches
    new Image().src = 'Speaking.png';        // preload so the swap doesn't flicker
    let showingSpeaking = false;

    function setFrame(speaking) {
      if (speaking === showingSpeaking) return;
      showingSpeaking = speaking;
      mainImg.src = speaking ? 'Speaking.png' : 'Main.png';
    }

    setInterval(() => {
      const audible = !player.paused && !player.ended && !player.muted && player.readyState > 2;
      if (audible) {
        setFrame(!showingSpeaking);          // flip between the two images
      } else {
        setFrame(false);                     // no audio = Main.png
      }
    }, SPEAK_MS);

    // Shuffle through every song before repeating, never the same one twice in a row
    function nextIndex() {
      if (!queue.length) {
        queue = songs.map((_, i) => i).sort(() => Math.random() - 0.5);
        if (queue.length > 1 && queue[0] === last) queue.push(queue.shift());
      }
      last = queue.shift();
      return last;
    }

    // Download the whole file first so a connection blip can't cut the song off
    function fetchSong(i) {
      if (!cache[i]) {
        cache[i] = fetch(songs[i])
          .then((r) => {
            if (!r.ok) throw new Error('bad response');
            return r.blob();
          })
          .then((b) => URL.createObjectURL(b))
          .catch(() => songs[i]); // fall back to normal streaming
      }
      return cache[i];
    }

    async function playNext() {
      if (loading) return;
      loading = true;
      const i = upcoming;
      const url = await fetchSong(i);
      player.src = url;
      updateMediaSession(i);
      upcoming = nextIndex();
      fetchSong(upcoming); // preload the one after this
      loading = false;
      try {
        await player.play();
      } catch (e) {
        // autoplay blocked: the first click on the image will start it
      }
    }

    // Lock screen / Control Center player
    function updateMediaSession(i) {
      if (!('mediaSession' in navigator)) return;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: songs[i].replace('.mp3', ''),
        artist: 'Baby Cartmen',
        album: 'babycartmen.org',
        artwork: [
          { src: 'Main.png', sizes: '1179x1169', type: 'image/png' }
        ]
      });
    }

    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', () => player.play());
      navigator.mediaSession.setActionHandler('pause', () => player.pause());
      navigator.mediaSession.setActionHandler('nexttrack', () => playNext());
    }

    player.addEventListener('ended', () => { errorStreak = 0; playNext(); });
    player.addEventListener('error', () => {
      if (++errorStreak < songs.length * 2) playNext();
    });

    // Single click = start / resume / next song
    function singleClick() {
      if (!player.src) {
        playNext();                          // first song still loading
      } else if (player.paused) {
        player.play().catch(() => {});       // resume
      } else {
        playNext();                          // skip to the next song
      }
    }

    // Double click = pause. Hold = toggle mute.
    const HOLD_MS = 500;
    const DOUBLE_MS = 250;
    let holdTimer = null;
    let clickTimer = null;
    let held = false;

    mainImg.addEventListener('pointerdown', () => {
      held = false;
      clearTimeout(holdTimer);
      holdTimer = setTimeout(() => {
        held = true;
        player.muted = !player.muted;
        showToast(player.muted ? 'Muted' : 'Unmuted');
      }, HOLD_MS);
    });

    ['pointerup', 'pointerleave', 'pointercancel'].forEach((evt) =>
      mainImg.addEventListener(evt, () => clearTimeout(holdTimer))
    );

    mainImg.addEventListener('click', () => {
      if (held) { held = false; return; }    // that was a hold, not a click

      if (clickTimer) {                      // second click in time = double click
        clearTimeout(clickTimer);
        clickTimer = null;
        player.pause();
        return;
      }

      clickTimer = setTimeout(() => {        // wait to see if a second click follows
        clickTimer = null;
        singleClick();
      }, DOUBLE_MS);
    });

    // Stop the long-press menu on phones from interrupting the hold
    mainImg.addEventListener('contextmenu', (e) => e.preventDefault());

    // Start loading right away and try to autoplay
    upcoming = nextIndex();
    fetchSong(upcoming);
    playNext();
  </script>
</body>
</html>
